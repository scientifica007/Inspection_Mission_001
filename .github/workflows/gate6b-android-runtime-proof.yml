name: Gate 6B Android Runtime Proof Preparation

on:
  push:
    branches:
      - implementation/gate6b-android-runtime-proof-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate6b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true
        id: node_with_cache

      - name: Set up Node 24 without cache for first scaffold
        if: steps.node_with_cache.outcome == 'failure'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap exact lockfile and generated Android project once
        id: scaffold
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json && -d android ]]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm install --no-audit --no-fund
          VITE_GIT_COMMIT="$GITHUB_SHA" npm run build
          if [[ ! -d android ]]; then
            npx cap add android
          fi
          npx cap sync android

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          if ! git diff --cached --quiet; then
            git commit -m "Gate 6B: pin npm lock and generate Android shell"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Stop bootstrap run after generated artifacts are persisted
        if: steps.scaffold.outputs.generated == 'true'
        run: echo "Generated package-lock.json/android were pushed; a subsequent branch commit/run performs the full validation."

      - name: Install pinned dependencies
        if: steps.scaffold.outputs.generated != 'true'
        run: npm ci --no-audit --no-fund

      - name: Validate project state JSON
        if: steps.scaffold.outputs.generated != 'true'
        run: python -m json.tool docs/project/CURRENT-STATE.json >/dev/null

      - name: Enforce runtime-neutral production core
        if: steps.scaffold.outputs.generated != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE "(from|import\()[[:space:]]*['\"]node:" src/application src/bootstrap; then
            echo "node:* import found in runtime-neutral production core"
            exit 1
          fi
          if grep -R -nE "@capacitor|@capacitor-community/sqlite" src/application src/bootstrap; then
            echo "Capacitor/plugin import leaked into runtime-neutral production core"
            exit 1
          fi

      - name: Typecheck
        if: steps.scaffold.outputs.generated != 'true'
        run: npm run typecheck

      - name: Gate 6B host adapter contract
        if: steps.scaffold.outputs.generated != 'true'
        run: npm run gate6b:host

      - name: Gate 5B adapter normalization 6/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5b_adapter_regression.ts

      - name: Gate 5B bootstrap 32/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5b_regression.ts

      - name: Gate 5C 55/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5c_regression.ts

      - name: Gate 5D 60/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5d_regression.ts

      - name: Gate 5E 79/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5e_regression.ts

      - name: Gate 5F 30/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5f_regression.ts

      - name: Gate 5G 41/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5g_regression.ts

      - name: Gate 5H 66/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5h_regression.ts

      - name: Gate 5I 48/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5i_regression.ts

      - name: Gate 5J 75/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5j_regression.ts

      - name: Gate 5K 82/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5k_regression.ts

      - name: Gate 5L 94/0
        if: steps.scaffold.outputs.generated != 'true'
        run: node tests/gate5l_regression.ts

      - name: Schema 100/0
        if: steps.scaffold.outputs.generated != 'true'
        run: python tests/gate4a_regression.py

      - name: Build Vite diagnostic shell
        if: steps.scaffold.outputs.generated != 'true'
        run: VITE_GIT_COMMIT="$GITHUB_SHA" npm run build

      - name: Sync Android
        if: steps.scaffold.outputs.generated != 'true'
        run: npx cap sync android

      - name: Build Android debug APK
        if: steps.scaffold.outputs.generated != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Check branch diff whitespace
        if: steps.scaffold.outputs.generated != 'true'
        run: git diff --check origin/main...HEAD

      - name: Upload synthetic Gate 6B debug APK
        if: steps.scaffold.outputs.generated != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate6b-device-proof-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
