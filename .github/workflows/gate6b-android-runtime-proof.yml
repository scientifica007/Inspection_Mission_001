name: Gate 6B Android Runtime Proof Preparation

on:
  push:
    branches:
      - implementation/gate6b-android-runtime-proof-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate6b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bootstrap lockfile and generated Android project when absent
        id: scaffold
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

          VITE_GIT_COMMIT="$(git rev-parse HEAD)" npm run build

          if [[ ! -d android ]]; then
            npx cap add android
          fi
          npx cap sync android

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          if ! git diff --cached --quiet; then
            git commit -m "Gate 6B: pin npm lock and generate Android shell"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          echo "tested_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate project state JSON
        run: python -m json.tool docs/project/CURRENT-STATE.json >/dev/null

      - name: Enforce runtime-neutral production core
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE "(from|import\()[[:space:]]*['\"]node:" src/application src/bootstrap; then
            echo "node:* import found in runtime-neutral production core"
            exit 1
          fi
          if grep -R -nE "@capacitor|@capacitor-community/sqlite" src/application src/bootstrap; then
            echo "Capacitor/plugin import leaked into runtime-neutral production core"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Gate 6B host adapter contract
        run: npm run gate6b:host

      - name: Gate 5B adapter normalization 6/0
        run: node tests/gate5b_adapter_regression.ts

      - name: Gate 5B bootstrap 32/0
        run: node tests/gate5b_regression.ts

      - name: Gate 5C 55/0
        run: node tests/gate5c_regression.ts

      - name: Gate 5D 60/0
        run: node tests/gate5d_regression.ts

      - name: Gate 5E 79/0
        run: node tests/gate5e_regression.ts

      - name: Gate 5F 30/0
        run: node tests/gate5f_regression.ts

      - name: Gate 5G 41/0
        run: node tests/gate5g_regression.ts

      - name: Gate 5H 66/0
        run: node tests/gate5h_regression.ts

      - name: Gate 5I 48/0
        run: node tests/gate5i_regression.ts

      - name: Gate 5J 75/0
        run: node tests/gate5j_regression.ts

      - name: Gate 5K 82/0
        run: node tests/gate5k_regression.ts

      - name: Gate 5L 94/0
        run: node tests/gate5l_regression.ts

      - name: Schema 100/0
        run: python tests/gate4a_regression.py

      - name: Build Vite diagnostic shell
        run: VITE_GIT_COMMIT="${{ steps.scaffold.outputs.tested_sha }}" npm run build

      - name: Sync Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Check branch diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Check no runtime-core drift from main
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main...HEAD -- src/application src/bootstrap/adapter.ts docs/schema/schema.sql bootstrap/v1/checklist-v1.json

      - name: Upload synthetic Gate 6B debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gate6b-device-proof-debug-apk-run-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
