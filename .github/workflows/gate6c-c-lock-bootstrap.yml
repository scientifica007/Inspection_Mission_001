name: Gate 6C-C Final Cleanup Bootstrap

on:
  push:
    branches:
      - implementation/gate6c-c-android-evidence-adapters-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-non-workflow-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply authorized Gate 6C-C final cleanup and candidate-state promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build_gradle = Path('android/app/build.gradle')
          text = build_gradle.read_text(encoding='utf-8')
          text = text.replace('    ndkVersion "27.0.12077973"\n', '')
