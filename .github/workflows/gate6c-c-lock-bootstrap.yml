name: Gate 6C-C Final Cleanup Bootstrap

on:
  push:
    branches:
      - implementation/gate6c-c-android-evidence-adapters-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-non-workflow-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply authorized Gate 6C-C non-workflow cleanup
        run: python3 tools/gate6c_c_finalize.py
      - name: Commit non-workflow cleanup if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No non-workflow cleanup change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- android/app/build.gradle android/app/src/main/java/com/scientifica/inspection/gate6bproof/Gate6CAtomicPublisher.java android/app/src/main/cpp docs/architecture/GATE6C-C-ANDROID-EVIDENCE-QUALIFICATION-v1.md docs/project/CURRENT-STATE.json docs/project/CURRENT-STATE.md
          git commit -m "Gate 6C-C: finalize non-workflow candidate cleanup"
          git push origin "HEAD:${GITHUB_REF_NAME}"
