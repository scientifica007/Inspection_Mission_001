              cmake {
                  path file('src/main/cpp/CMakeLists.txt')
                  version '3.22.1'
              }
          }
          """
          if native_block not in text:
              raise SystemExit('expected externalNativeBuild block not found')
          text = text.replace(native_block, '')
          build_gradle.write_text(text, encoding='utf-8')

          for raw in [
              'android/app/src/main/java/com/scientifica/inspection/gate6bproof/Gate6CAtomicPublisher.java',
              'android/app/src/main/cpp/gate6c_atomic_publish.c',
              'android/app/src/main/cpp/CMakeLists.txt',
          ]:
              path = Path(raw)
              if path.exists():
                  path.unlink()

          state_json = Path('docs/project/CURRENT-STATE.json')
          text = state_json.read_text(encoding='utf-8')
          replacements = {
              '"current_substage_status": "NEXT_NOT_STARTED"': '"current_substage_status": "IN_PROGRESS_IMPLEMENTATION_REVIEW"',
              '"gate_6c_status": "IN_PROGRESS_6C_A_CLOSED_MERGED_6C_B_CLOSED_MERGED_6C_C_NEXT_NOT_STARTED",': '"gate_6c_status": "IN_PROGRESS_6C_A_CLOSED_MERGED_6C_B_CLOSED_MERGED_6C_C_IN_PROGRESS_IMPLEMENTATION_REVIEW",\n  "gate6c_c_started": true,',
              '"6C Evidence Storage + Camera/File Pipeline — IN_PROGRESS / 6C-A CLOSED / MERGED / 6C-B CLOSED / MERGED / 6C-C NEXT / NOT_STARTED"': '"6C Evidence Storage + Camera/File Pipeline — IN_PROGRESS / 6C-A CLOSED / MERGED / 6C-B CLOSED / MERGED / 6C-C IN_PROGRESS / IMPLEMENTATION_REVIEW"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected CURRENT-STATE.json marker missing: {old}')
              text = text.replace(old, new, 1)
          state_json.write_text(text, encoding='utf-8')

          state_md = Path('docs/project/CURRENT-STATE.md')
          text = state_md.read_text(encoding='utf-8')
          replacements = {
              'Gates 1→5L و6A و6B مغلقة/معتمدة/مدمجة كما هو موثق في history. Gate 6C-A وGate 6C-B مغلقتان/مدمجتان كـsub-stages، بينما Gate 6C ككل ما تزال IN_PROGRESS وGate 6C-C هي المرحلة التالية ولم تبدأ.': 'Gates 1→5L و6A و6B مغلقة/معتمدة/مدمجة كما هو موثق في history. Gate 6C-A وGate 6C-B مغلقتان/مدمجتان كـsub-stages، بينما Gate 6C ككل ما تزال IN_PROGRESS وGate 6C-C قيد التنفيذ في حالة IMPLEMENTATION_REVIEW.',
              'الحالة: **`NEXT / NOT_STARTED`**.\n\nلم يبدأ تنفيذ Camera/gallery/generic-file Android adapters، ولا `content://` streaming/copy spikes، ولا `appRestoredResult`، ولا durable Android EvidenceStorage. تتطلب 6C-C تفويضًا مستقلًا قبل التنفيذ.': 'الحالة: **`IN_PROGRESS / IMPLEMENTATION_REVIEW`**.\n\nبدأ تنفيذ Android Camera/gallery/generic-file acquisition وdurable EvidenceStorage وتم الوصول إلى executable emulator qualification على API24 وAPI35، بما في ذلك full EvidenceService integration وstartup reconciliation. سجل الإثبات المرشح: `docs/architecture/GATE6C-C-ANDROID-EVIDENCE-QUALIFICATION-v1.md`. هذه الحالة لا تعني إغلاق Gate 6C-C ولا تمثل Gate 6C-D physical qualification.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected CURRENT-STATE.md marker missing: {old[:80]}')
              text = text.replace(old, new, 1)
          state_md.write_text(text, encoding='utf-8')

          proof = Path('docs/architecture/GATE6C-C-ANDROID-EVIDENCE-QUALIFICATION-v1.md')
          proof.write_text('''# Gate 6C-C — Android Evidence Adapter Candidate Qualification v1

Status: **IN_PROGRESS / IMPLEMENTATION_REVIEW**  
Classification: **PROJECT / executable qualification evidence**  
Gate 6C-C is **not CLOSED**. Gate 6C-D physical qualification has **not started**.

## 1. Scope and governing boundary

Governing live-main basis at this qualification sequence: `976b48106824f84f0dbbbca82832cbad4e53afb7`.

Gate 6C-C qualifies the Android Camera/gallery/generic-file acquisition seams and durable app-private `EvidenceStorage` implementation against the already-closed Gate-6C-A storage contract and already-closed Gate-6C-B Evidence orchestration. No Gate-6C-C change reopens `src/application/**`, `src/bootstrap/**`, the canonical schema, or the canonical bootstrap.

The adopted publication candidate is the composite guarded Android `Os.rename` sequence implemented by `Gate6CEvidenceStore`: the application allocates a fresh canonical destination, preflights destination absence, stages and hashes a complete object, checks destination absence again immediately before publication, executes `Os.rename`, then verifies the published object and relies on the closed application transaction/reconciliation protocol for cross-store convergence.

Its exact concurrency/threat boundary is the Gate-6C-A boundary: in-contract Evidence maintenance/write operations are serialized by the shared single-process Evidence boundary and storage is app-private. The publication sequence does **not** claim a syscall-level `RENAME_NOREPLACE` guarantee against privileged/root/direct external filesystem mutation or arbitrary out-of-contract concurrent writers. SQLite's transactional `storage_ref` recheck, startup reconciliation, and hash verification remain part of the composite safety model.

## 2. Native Evidence qualification

Executable Android instrumentation on the Web-runtime compatibility candidate SHA `8bcfb86815e668a4f62e89c868e0f0d292369d76`, workflow run `34519077891`:

- API 24: **18 / 18 PASS**.
- API 35: **18 / 18 PASS**.

The native suite proves, among other checks:

- canonical lowercase UUID-v4 final references under `evidence/v1/objects/` and canonical `.incoming` staging;
- synthetic `content://` streaming copy using a fixed **64-KiB** buffer;
- incremental SHA-256 during copy;
- `file_size` derived from actual copied bytes;
- large synthetic input handled through the streaming path;
- pre-existing final destination is rejected before rename and preserved byte-for-byte;
- interruption before rename leaves no final object;
- interruption immediately after successful rename leaves a complete, discoverable final object suitable for reconciliation;
- reopen of a new storage instance can stat/hash/resolve the published app-private object.

The production Evidence binary does not traverse JavaScript as Base64, `Blob`, `ArrayBuffer`, or `Uint8Array`, and the adopted publication path has no JNI binary transport.

## 3. Full EvidenceService integration qualification

The same workflow run `34519077891` executed the production Vite bundle and the exact `Gate6CEvidenceIntegrationInstrumentedTest` class on both emulator API levels.

### API 24

- selected provider request: `com.android.chrome`;
- provider switch result: `Success`;
- actual usable provider: `com.android.chrome 69.0.3497.100`;
- `Starting 2 tests` observed;
- `Finished 2 tests` observed;
- Gradle `BUILD SUCCESSFUL` observed;
- integration completion marker observed with exact tested Git SHA `8bcfb86815e668a4f62e89c868e0f0d292369d76`;
- result: **2 / 2 PASS**.

### API 35

- actual provider: `com.android.webview 124.0.6367.219`;
- `Starting 2 tests` observed;
- `Finished 2 tests` observed;
- Gradle `BUILD SUCCESSFUL` observed;
- integration completion marker observed with exact tested Git SHA `8bcfb86815e668a4f62e89c868e0f0d292369d76`;
- result: **2 / 2 PASS**.

The normal integration path asserts:

`synthetic content://` → closed `EvidenceService` orchestration → Android `EvidenceStorage` → complete stage / actual-byte size / SHA-256 → publication → `BEGIN IMMEDIATE` → Evidence INSERT → successful COMMIT → close SQLite/runtime → reopen the same SQLite → startup reconciliation → committed metadata match → `verifyHash = MATCH` → resolve to managed FileProvider `content://` handle.

The diagnostic deliberately supplies `sizeHint = 1`; persisted `file_size` must equal the independently measured source byte count, proving that the hint is not authoritative. The event recorder requires `storage.publish.complete` before `db.beginImmediate.start`, requires publication before `db.evidenceInsert.start`, and requires successful `db.commit.complete`.

## 4. Real zero-row orphan reconciliation proof

The second full integration test proves the required failure/restart path without substituting native direct deletion:

complete stage → successful rename publication → injected stop before any Evidence row is committed → exact SQLite lookup proves zero committed rows for that `storage_ref` → close/recreate runtime → invoke the **closed Gate-6C-B `EvidenceService` / `EvidenceApplicationContext` startup reconciliation** → final zero-row orphan detected → cleanup through the existing reconciliation contract → readiness becomes `READY` → final orphan no longer exists → SQLite still contains zero Evidence rows for that reference.

This path passed on both API24 and API35 in run `34519077891`.

## 5. Web runtime compatibility decision

Earlier API24 qualification selected the available Chrome 69 provider but the `es2022` Vite production bundle failed before proof registration with `Uncaught SyntaxError: Unexpected token ?`. This was classified as `API24_WEB_RUNTIME_BUILD_TARGET_INCOMPATIBILITY`, not an Evidence/native/storage contradiction.

Focused production-build spike result: **`WEB_RUNTIME_COMPATIBILITY_SPIKE_PASS`**.

- Vite: `8.2.2`.
- adopted candidate build target: `chrome69`.
- no `@vitejs/plugin-legacy` added;
- no speculative polyfills added;
- production asset set on the passing spike included `index-B-a16-81.js`, `web-RjdCDqQr.js`, `web-BLj64B_g.js`, and `index-DerZeG6_.css`;
- main JS size: `505.06 kB` (`126.65 kB` gzip), versus the preceding `es2022` candidate `501.60 kB` (`125.55 kB` gzip), a delta of `+3.46 kB` raw and `+1.10 kB` gzip;
- authoritative compatibility proof is successful execution of both full integration tests in the actual API24 Chrome 69 WebView, not textual syntax grep.

`minSdkVersion = 24` remains the Android OS/native floor. Separately, the production JavaScript bundle is compiled for Chrome 69+ syntax compatibility. This is a **PROJECT/runtime compatibility decision**, not a requirement from the official inspection sources. Supporting this syntax floor is not a recommendation to deploy insecure or end-of-life Android/WebView software.

## 6. Rejected publication/storage candidates retained as historical findings

### renameat2

**`RENAMEAT2_NOREPLACE_REJECTED_FOR_API24_BASELINE`**.

On the API24 baseline, the executable `renameat2(..., RENAME_NOREPLACE)` candidate returned **`ENOSYS (38)`**. Therefore its JNI/C syscall implementation is rejected for Gate 6C-C production and removed from the final candidate.

### hard link

Android `Os.link` publication candidate: **REJECTED / `EACCES`** in executable qualification. It is not the adopted production publication primitive.

### Capacitor Filesystem plugin

**`FILESYSTEM_PLUGIN_REJECTED_FOR_EVIDENCE_STORAGE`**.

The earlier `@capacitor/filesystem@8.1.3` candidate API did not expose a primitive-level no-replace publication contract sufficient to prove the required EvidenceStorage publication semantics. It is therefore removed from `package.json` and `package-lock.json`; final Capacitor synchronization must list only the retained Android plugins and must not load Filesystem.

## 7. Security, permissions, and qualification limit

- `minSdkVersion` remains **24**.
- Evidence storage remains app-private.
- no `READ_EXTERNAL_STORAGE`, `WRITE_EXTERNAL_STORAGE`, or `MANAGE_EXTERNAL_STORAGE` permission is introduced.
- generic file import uses the bounded read-only acquisition path; imported data is copied into managed app-private storage.
- repository qualification uses synthetic data only; no real Evidence, production database, personal data, device serial, or secret is qualification input.
- emulator API24/API35 evidence is **not** physical Gate-6C-D qualification.

## 8. Candidate disposition

Gate 6C remains **IN_PROGRESS**. Gate 6C-A and Gate 6C-B remain **CLOSED / MERGED**. Gate 6C-C advances only to **IN_PROGRESS / IMPLEMENTATION_REVIEW** with `gate6c_c_started = true`. Gate 6C-D and Gate 6D remain **NOT_STARTED**.

A completely new exact-final-SHA CI run is required after this proof, cleanup, dependency removal, workflow cleanup, and state update are committed. Its run/artifact identifiers are intentionally reported in the implementation handoff rather than embedded here, because this document itself is part of the SHA that the final run must qualify.
