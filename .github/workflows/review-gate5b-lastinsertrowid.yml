name: Gate 5B lastInsertRowid correction validation

on:
  push:
    branches:
      - correction/gate5b-lastinsertrowid-normalization-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Focused Gate 5B adapter normalization regression
        run: node --experimental-strip-types tests/gate5b_adapter_regression.ts

      - name: Gate 5B bootstrap regression
        run: node --experimental-strip-types tests/gate5b_regression.ts

      - name: Gate 5C through Gate 5L regressions
        shell: bash
        run: |
          set -euo pipefail
          for suite in \
            gate5c_regression.ts \
            gate5d_regression.ts \
            gate5e_regression.ts \
            gate5f_regression.ts \
            gate5g_regression.ts \
            gate5h_regression.ts \
            gate5i_regression.ts \
            gate5j_regression.ts \
            gate5k_regression.ts \
            gate5l_regression.ts
          do
            node --experimental-strip-types "tests/${suite}"
          done

      - name: Schema regression
        run: python3 tests/gate4a_regression.py

      - name: Re-check audited runtime SQL shapes
        shell: bash
        run: |
          set -euo pipefail
          echo 'Authoritative runtime INSERT statements:'
          grep -RIn --exclude-dir=.git -E 'INSERT[[:space:]]+(OR[[:space:]]+[A-Z]+[[:space:]]+)?INTO|^[[:space:]]*REPLACE[[:space:]]+INTO' src/bootstrap src/application || true
          if grep -RIn --exclude-dir=.git -E 'INSERT[[:space:]]+OR[[:space:]]+IGNORE|INSERT[[:space:]].*ON[[:space:]]+CONFLICT|^[[:space:]]*REPLACE[[:space:]]|WITH[[:space:]].*INSERT' src/bootstrap src/application; then
            echo 'Unsupported complex runtime INSERT shape appeared; narrow correction assumption must be reviewed.' >&2
            exit 1
          fi

      - name: Diff and scope hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=25cd1ed248b3962a9fefc6cc1c1115bf27961551
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | while IFS= read -r path; do
            case "$path" in
              dev/node-sqlite-adapter.ts|tests/gate5b_adapter_regression.ts|docs/application/GATE5B-LASTINSERTROWID-CORRECTION-v1.md|docs/project/CURRENT-STATE.md|docs/project/CURRENT-STATE.json|docs/project/TEST-BASELINES.md|README.md|.github/workflows/review-gate5b-lastinsertrowid.yml) ;;
              *) echo "Unexpected correction path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --exit-code "$BASE" -- src/bootstrap/adapter.ts docs/schema/schema.sql bootstrap src/application
